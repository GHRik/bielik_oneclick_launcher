<path d="M280 82v14m6-21v21m6-10v10" stroke="#746b81" stroke-width="2" stroke-linecap="round"/>
<path d="M32 119h276" stroke="#ebe7f0"/>
<text x="170" y="143" text-anchor="middle" class="small muted">TWOJA PRZESTRZEŃ</text>
<rect x="94" y="164" width="203" height="67" rx="16" fill="#7450d8"/>
<text x="112" y="190" class="body white">Pomóż mi zacząć dzień</text><text x="112" y="209" class="body white">z dobrym pomysłem.</text>
<circle cx="49" cy="266" r="13" fill="#e9e2f7"/><text x="49" y="271" text-anchor="middle" font-weight="700" font-size="14" fill="#7450d8">B</text><text x="71" y="270" font-size="11" font-weight="600">Bielik</text>
<rect x="36" y="288" width="261" height="188" rx="17" fill="white" stroke="#e9e4ef"/>
<text x="53" y="316" class="body">Zacznij od małego kroku.</text>
<text x="53" y="343" class="body">Zapisz jedną rzecz, którą</text><text x="53" y="363" class="body">chcesz dziś zrobić dla siebie.</text>
<text x="53" y="393" class="body">Może krótki spacer, nowy</text><text x="53" y="413" class="body">pomysł albo chwila spokoju?</text>
<text x="53" y="445" class="body" font-weight="600">Od czego zaczynamy?</text>
<text x="170" y="514" text-anchor="middle" class="small muted">Po polsku. Po Twojemu.</text>
<rect x="34" y="557" width="272" height="52" rx="21" fill="#fff" stroke="#e7e1ef"/>
<text x="51" y="588" font-size="12" class="muted">Napisz wiadomość…</text>
