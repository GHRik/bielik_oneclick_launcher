name: bielik_oneclick_launcher
description: "Aplication to install Edge-AI Bielik in one-click and use it in chat."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_chat_core: ^2.0.0
  flutter_chat_ui: ^2.12.0
  material_ui: ^1.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0


flutter:

  uses-material-design: true
