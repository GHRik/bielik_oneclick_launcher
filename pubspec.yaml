name: bielik_oneclick_launcher
description: "Aplication to install Edge-AI Bielik in one-click and use it in chat."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter

  characters: ^1.4.0
  crypto: ^3.0.6
  cupertino_icons: ^1.0.8
  file_selector: ^1.1.0
  flutter_chat_core: ^2.0.0
  flutter_chat_ui: ^2.12.0
  flutter_downloader: ^1.12.1
  flutter_markdown_plus: ^1.0.12
  llamadart: ^0.17.5
  material_ui: ^1.10.0
  path: ^1.9.1
  path_provider: ^2.1.5
  sqflite: ^2.4.5
  sqflite_common_ffi: ^2.4.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  flutter_lints: ^6.0.0


hooks:
  user_defines:
    llamadart:
      llamadart_native_backends:
        platforms:
          android-arm64: [cpu, vulkan, opencl]
          android-x64: [cpu, vulkan, opencl]

flutter:

  uses-material-design: true
