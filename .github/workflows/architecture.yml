name: Architecture

on:
  push:
    branches: [master]
    paths:
      - 'lib/**'
      - 'test/**'
      - 'android/**'
      - 'ios/**'
      - 'linux/**'
      - 'macos/**'
      - 'windows/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'analysis_options*.yaml'
      - '!**/*.md'
      - '!test/e2e/output/**'
  pull_request:
    branches: [master]
    paths:
      - 'lib/**'
      - 'test/**'
      - 'android/**'
      - 'ios/**'
      - 'linux/**'
      - 'macos/**'
      - 'windows/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'analysis_options*.yaml'
      - '!**/*.md'
      - '!test/e2e/output/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: architecture-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  architecture:
    name: Architecture
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.9'
          cache: true

      - name: Install locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Run architecture
        run: |
          mkdir -p reports
          set -o pipefail
          flutter test --no-pub --reporter expanded --file-reporter json:reports/architecture.json test/architecture 2>&1 | tee reports/architecture.log

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: architecture-reports
          path: reports/
          if-no-files-found: warn
          retention-days: 14
