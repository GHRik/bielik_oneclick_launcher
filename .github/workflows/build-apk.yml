name: Release APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Checkout selected commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.9'
          cache: true

      - name: Install locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Analyze
        run: flutter analyze --no-pub

      - name: Test
        run: flutter test --no-pub

      - name: Build ARM64 test APK
        run: flutter build apk --debug --no-pub --target-platform android-arm64

      - name: Prepare download
        id: package
        env:
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_REF: ${{ github.ref_name }}
        run: |
          short_sha="${SOURCE_SHA:0:12}"
          apk_name="bielik-arm64-${short_sha}.apk"
          release_tag="apk-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-debug.apk "dist/${apk_name}"
          (cd dist && sha256sum "${apk_name}" > "${apk_name}.sha256")
          {
            printf 'Bielik OneClick Launcher — testowe APK dla Android ARM64.\n\n'
            printf 'Branch: %s\nCommit: %s\n' "$SOURCE_REF" "$SOURCE_SHA"
            printf 'Kod: https://github.com/%s/tree/%s\n' "$GITHUB_REPOSITORY" "$SOURCE_SHA"
            printf 'Build: https://github.com/%s/actions/runs/%s\n\n' "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
            printf 'Flutter: 3.47.9. Konfiguracja: debug. Modele pobierane osobno w aplikacji.\n'
          } > dist/BUILD.txt
          printf 'apk_name=%s\nrelease_tag=%s\nshort_sha=%s\n' "$apk_name" "$release_tag" "$short_sha" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: bielik-arm64-${{ steps.package.outputs.short_sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

      - name: Publish downloadable APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ steps.package.outputs.release_tag }}
          RELEASE_TITLE: Bielik APK · ${{ github.ref_name }} · ${{ steps.package.outputs.short_sha }}
        run: |
          gh release create "$RELEASE_TAG" dist/* \
            --target "$SOURCE_SHA" \
            --title "$RELEASE_TITLE" \
            --notes-file dist/BUILD.txt \
            --prerelease \
            --latest=false
          release_url="$(gh release view "$RELEASE_TAG" --json url --jq .url)"
          printf '### APK gotowe\n\n[Pobierz APK](%s)\n\nCommit: `%s`\n' "$release_url" "$SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"
