name: Release APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apk-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Checkout selected commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Check signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              printf '::error::Missing signing secret: %s. See docs/RELEASING.md\n' "$name"
              exit 1
            fi
          done

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.9'
          cache: true

      - name: Install locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Analyze
        run: flutter analyze --no-pub

      - name: Test
        run: flutter test --no-pub

      - name: Assign increasing Android version code
        id: version
        run: |
          build_number=$(( $(date -u +%s) - 1577836800 ))
          if (( build_number <= 0 || build_number >= 2100000000 )); then
            printf '::error::Android version code is outside the supported range.\n'
            exit 1
          fi
          printf 'build_number=%s\n' "$build_number" >> "$GITHUB_OUTPUT"

      - name: Restore release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/bielik-release.jks"

      - name: Build signed ARM64 release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/bielik-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build apk --release --target-platform android-arm64 --build-number="${{ steps.version.outputs.build_number }}"

      - name: Remove private keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/bielik-release.jks"

      - name: Verify signing identity
        run: |
          mkdir -p dist
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          if [[ -z "$apksigner" ]]; then
            printf '::error::Android apksigner was not found.\n'
            exit 1
          fi
          "$apksigner" verify --verbose --print-certs build/app/outputs/flutter-apk/app-release.apk > dist/SIGNING.txt
          cat dist/SIGNING.txt
          actual="$(awk '/^(Signer #[0-9]+|V[0-9.]+ Signer):? certificate SHA-256 digest:/ {sub(/^.* certificate SHA-256 digest:[[:space:]]*/, ""); gsub(/[[:space:]]/, ""); print tolower($0)}' dist/SIGNING.txt | sort -u)"
          expected="$(tr -d '[:space:]' < android/release-signing.sha256 | tr '[:upper:]' '[:lower:]')"
          printf 'Expected certificate SHA-256: %s\n' "$expected"
          printf 'Actual certificate SHA-256: %s\n' "${actual:-<not found>}"
          if [[ ! "$expected" =~ ^[0-9a-f]{64}$ || ! "$actual" =~ ^[0-9a-f]{64}$ || "$actual" != "$expected" ]]; then
            printf '::error::The APK signing certificate does not match the pinned release identity. See the public certificate details above.\n'
            exit 1
          fi

      - name: Prepare download
        id: package
        env:
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_REF: ${{ github.ref_name }}
          BUILD_NUMBER: ${{ steps.version.outputs.build_number }}
        run: |
          short_sha="${SOURCE_SHA:0:12}"
          apk_name="bielik-arm64.apk"
          release_tag="apk-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cp build/app/outputs/flutter-apk/app-release.apk "dist/${apk_name}"
          (cd dist && sha256sum "${apk_name}" > "${apk_name}.sha256")
          cp LICENSE dist/LICENSE
          {
            printf 'Bielik OneClick Launcher — signed release APK for Android ARM64.\n\n'
            printf 'Branch: %s\nCommit: %s\nAndroid version code: %s\n' "$SOURCE_REF" "$SOURCE_SHA" "$BUILD_NUMBER"
            printf 'Source: https://github.com/%s/tree/%s\n' "$GITHUB_REPOSITORY" "$SOURCE_SHA"
            printf 'Build: https://github.com/%s/actions/runs/%s\n\n' "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
            printf 'Flutter: 3.47.9. Release configuration. Models are downloaded separately in the app.\n'
            printf 'Install over a previous release signed with the same certificate to preserve app data.\n'
            printf 'Older debug APKs can have incompatible signatures. Do not uninstall them if you need their local data.\n'
          } > dist/BUILD.txt
          printf 'apk_name=%s\nrelease_tag=%s\nshort_sha=%s\n' "$apk_name" "$release_tag" "$short_sha" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: bielik-arm64-${{ steps.version.outputs.build_number }}-${{ steps.package.outputs.short_sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

      - name: Publish prerelease APK for testing
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ steps.package.outputs.release_tag }}
          RELEASE_TITLE: Bielik APK · ${{ steps.version.outputs.build_number }} · ${{ steps.package.outputs.short_sha }}
        run: |
          gh release create "$RELEASE_TAG" dist/* \
            --target "$SOURCE_SHA" \
            --title "$RELEASE_TITLE" \
            --notes-file dist/BUILD.txt \
            --prerelease --latest=false
          release_url="$(gh release view "$RELEASE_TAG" --json url --jq .url)"
          printf '### Test APK ready (prerelease)\n\n[Download test APK](%s)\n\nCommit: `%s`\n\nAfter testing, remove the prerelease flag and mark this release as Latest to update the public download links.\n' "$release_url" "$SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"
